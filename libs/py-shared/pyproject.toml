[project]
name = "py-shared"
version = "0.1.0"
description = "Shared JWT, RabbitMQ, and error-schema helpers for CreditFlow FastAPI services"
requires-python = ">=3.10"
dependencies = [
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "aio-pika>=9.4.0",
    "fastapi>=0.111.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["py_shared*"]
