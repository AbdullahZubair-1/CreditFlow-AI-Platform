services:
  # Containerized Postgres — one instance, one schema per service (see each
  # service's DATABASE_URL below), the same pattern used when this ran
  # against a native host install. No host port is published: every service
  # reaches it over the internal Docker network as "postgres:5432", so this
  # can coexist with an unrelated native Postgres install still listening on
  # the host's own 5432 without a port conflict. Data persists in the
  # postgres_data named volume across restarts.
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creditflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creditflow}
      POSTGRES_DB: ${POSTGRES_DB:-creditflow}
    # Postgres 18's official image moved to major-version-specific data
    # directories (pg_ctlcluster-style) and now expects the volume mounted
    # one level up at /var/lib/postgresql, not at .../data directly —
    # mounting at .../data (the pre-18 convention) makes the entrypoint
    # detect a stray "unused mount" and refuse to start.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creditflow} -d ${POSTGRES_DB:-creditflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8001:8000"

  user-tenant:
    build:
      context: .
      dockerfile: services/user-tenant/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AUTH_SERVICE_URL: http://auth:8000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8002:8000"

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-price_pro_placeholder}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-price_team_placeholder}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8003:8000"

  credits:
    build:
      context: .
      dockerfile: services/credits/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      BILLING_SERVICE_URL: http://billing:8000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      billing:
        condition: service_started
    ports:
      - "8004:8000"

  usage:
    build:
      context: .
      dockerfile: services/usage/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8005:8000"

  ai-generation:
    build:
      context: .
      dockerfile: services/ai-generation/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      USAGE_SERVICE_URL: http://usage:8000
      GROQ_API_KEY: ${GROQ_API_KEY:-gsk_placeholder}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      usage:
        condition: service_started
    ports:
      - "8006:8000"

  content:
    build:
      context: .
      dockerfile: services/content/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - content_uploads:/app/uploads
    ports:
      - "8007:8000"

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CELERY_REDIS_URL: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8008:8000"

  scheduler-worker:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CELERY_REDIS_URL: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  scheduler-beat:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CELERY_REDIS_URL: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  social-publishing:
    build:
      context: .
      dockerfile: services/social-publishing/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CONTENT_SERVICE_URL: http://content:8000
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-linkedin-client-id-placeholder}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-linkedin-client-secret-placeholder}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-http://localhost:8080/social/linkedin/callback}
      FRONTEND_CONNECTIONS_URL: ${FRONTEND_CONNECTIONS_URL:-http://localhost:5173/linkedin-connections}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-gGLNraB90AVpJD2_S0MA8qURS80AvCLzs96rMpEkCRw=}
      OAUTH_STATE_KEY: ${OAUTH_STATE_KEY:-Pn_HZpWVb9vdcDE5ILlBxerWRG-xM_JIShAh90Gl2y8=}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      content:
        condition: service_started
    ports:
      - "8009:8000"

  scraper:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8010:8000"

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AUTH_SERVICE_URL: http://auth:8000
      USER_TENANT_SERVICE_URL: http://user-tenant:8000
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-smtp-placeholder@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-smtp-placeholder}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-CreditFlow <smtp-placeholder@gmail.com>}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
      user-tenant:
        condition: service_started
    ports:
      - "8011:8000"

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-creditflow}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      USER_TENANT_SERVICE_URL: http://user-tenant:8000
      BILLING_SERVICE_URL: http://billing:8000
      CREDITS_SERVICE_URL: http://credits:8000
      USAGE_SERVICE_URL: http://usage:8000
      AUTH_SERVICE_URL: http://auth:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8012:8000"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AUTH_SERVICE_URL: http://auth:8000
      USER_TENANT_SERVICE_URL: http://user-tenant:8000
      BILLING_SERVICE_URL: http://billing:8000
      CREDITS_SERVICE_URL: http://credits:8000
      USAGE_SERVICE_URL: http://usage:8000
      AI_GENERATION_SERVICE_URL: http://ai-generation:8000
      CONTENT_SERVICE_URL: http://content:8000
      SCHEDULER_SERVICE_URL: http://scheduler:8000
      SOCIAL_PUBLISHING_SERVICE_URL: http://social-publishing:8000
      SCRAPER_SERVICE_URL: http://scraper:8000
      ADMIN_SERVICE_URL: http://admin:8000
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
      user-tenant:
        condition: service_started
      scraper:
        condition: service_started
      billing:
        condition: service_started
      credits:
        condition: service_started
      usage:
        condition: service_started
      ai-generation:
        condition: service_started
      content:
        condition: service_started
      scheduler:
        condition: service_started
      social-publishing:
        condition: service_started
      admin:
        condition: service_started
    ports:
      - "8080:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Empty, not a host:port — once nginx unifies frontend + Gateway
      # under one origin (see nginx/nginx.conf), apiFetch's relative paths
      # resolve against whatever origin the browser actually loaded the
      # page from (nginx on :80 locally, or the public ngrok URL), rather
      # than hardcoding a specific port that only works for direct,
      # un-proxied access.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - gateway
    ports:
      - "5173:5173"

  # Single entry point unifying the frontend and every Gateway-proxied API
  # route under one origin — see nginx/nginx.conf for the exact routing
  # rules and why /dashboard/summary and /admin each need special-cased
  # exact-match handling ahead of their broader prefixes.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - frontend
    ports:
      - "80:80"

  # Tunnels nginx's single origin to a public HTTPS URL, so LinkedIn OAuth
  # callbacks and Stripe webhooks (which both require a real internet-
  # reachable endpoint) can reach this local docker-compose stack.
  # NGROK_AUTHTOKEN is required (free account at ngrok.com). NGROK_STATIC_DOMAIN
  # is required by this compose file's --domain flag below — every free ngrok
  # account is issued exactly one permanent "dev domain" (visible on the
  # Domains page of the dashboard) that never changes; pinning it explicitly
  # here means the public URL stays identical across every container
  # restart, so LINKEDIN_REDIRECT_URI and the LinkedIn app's own registered
  # redirect URI only ever need to be set once.
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    # No custom entrypoint — the official image's own default entrypoint
    # handles making the local inspection API (port 4040) reachable
    # correctly; a custom `sh -c` override (tried first) bypassed that and
    # left it bound to 127.0.0.1 inside the container, unreachable through
    # the port mapping below even with `ports:` set correctly. Domain
    # substitution happens via compose's own ${VAR} interpolation (not a
    # shell) specifically to avoid needing that entrypoint override again.
    command: ["http", "nginx:80", "--url=https://${NGROK_STATIC_DOMAIN}"]
    depends_on:
      - nginx
    ports:
      - "4040:4040"

volumes:
  postgres_data:
  content_uploads:
  mongo_data:
