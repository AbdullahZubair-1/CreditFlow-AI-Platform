events {
    worker_connections 1024;
}

http {
    # Vite's dev server client (HMR) sends its own Origin/Host expectations;
    # raising these is harmless here and avoids 413s on the largest payload
    # this app sends over HTTP directly (content image uploads).
    client_max_body_size 25m;

    upstream gateway_upstream {
        server gateway:8000;
    }

    upstream frontend_upstream {
        server frontend:5173;
    }

    server {
        listen 80;

        # Forwarded headers every proxied location needs (client IP, real
        # scheme/host for anything that builds an absolute URL from the
        # request, e.g. Stripe checkout success_url, LinkedIn OAuth state).
        # Declared once here rather than repeated per-location: nginx
        # inherits proxy_set_header into child locations *unless* a location
        # sets its own — the websocket location below re-declares the full
        # set for exactly that reason.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Exact-match collision fix ---
        # The frontend's entire /dashboard/* namespace is client-side SPA
        # routing, but the Gateway also registers one real API endpoint at
        # this exact path. `location =` has the highest match precedence in
        # nginx (checked before any prefix location, regardless of the
        # order they're declared in), so this always wins over the /
        # catch-all below without needing careful ordering.
        location = /dashboard/summary {
            proxy_pass http://gateway_upstream;
        }

        # The frontend also has exactly one page at the literal path
        # /admin (the SuperAdmin console) that the Gateway's /admin/{path}
        # catch-all would otherwise swallow. Same fix: exact-match the bare
        # page load to the frontend; every actual API call the page makes
        # once loaded is to /admin/<something> and hits the prefix location
        # below instead.
        location = /admin {
            proxy_pass http://frontend_upstream;
        }

        # Same fix again for the SuperAdmin user-directory page: its own
        # path is deliberately NOT /admin/users, since that string is
        # already the Admin service's GET /admin/users API endpoint (which
        # this very page calls) — reusing it would make the exact same
        # path ambiguous between "load the page" and "call the API",
        # which nginx has no way to disambiguate on path alone.
        location = /admin/directory {
            proxy_pass http://frontend_upstream;
        }

        # --- Backend API prefixes -> Gateway ---
        # One location per top-level prefix the Gateway registers
        # (services/gateway/app/api/routes.py) — dispatch to the correct
        # downstream microservice happens inside the Gateway itself, so a
        # single proxy_pass per prefix is sufficient here.
        location /auth/ { proxy_pass http://gateway_upstream; }
        location /me/ { proxy_pass http://gateway_upstream; }
        location /accounts { proxy_pass http://gateway_upstream; }
        location /invites/ { proxy_pass http://gateway_upstream; }
        location /billing/ { proxy_pass http://gateway_upstream; }
        location /credits/ { proxy_pass http://gateway_upstream; }
        location /usage/ { proxy_pass http://gateway_upstream; }
        location /generations { proxy_pass http://gateway_upstream; }
        location /models { proxy_pass http://gateway_upstream; }
        location /content { proxy_pass http://gateway_upstream; }
        location /scheduled { proxy_pass http://gateway_upstream; }
        location /social/ { proxy_pass http://gateway_upstream; }
        location /scrape-jobs { proxy_pass http://gateway_upstream; }
        location /scraped-documents/ { proxy_pass http://gateway_upstream; }
        location /uploads/ { proxy_pass http://gateway_upstream; }
        location /webhooks/ { proxy_pass http://gateway_upstream; }
        location /admin/ { proxy_pass http://gateway_upstream; }

        # Server-Sent Events (AI generation token streaming) — buffering
        # off and a long read timeout, otherwise nginx holds the whole
        # response until the connection closes instead of forwarding each
        # token chunk as it arrives, defeating the entire point of SSE.
        location /sse/ {
            proxy_pass http://gateway_upstream;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # --- Everything else: frontend SPA (+ Vite HMR websocket) ---
        # Re-declares the forwarded headers set at server level because
        # this location also sets Upgrade/Connection for Vite's HMR
        # websocket — nginx's proxy_set_header inheritance is all-or-
        # nothing per location once any proxy_set_header is set locally.
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
